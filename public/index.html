<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

/* ==================== API Layer (Backend) ==================== */
const API = {
  token: null,
  socket: null,
  setToken(t) { this.token = t; if (t) localStorage.setItem('msdk_token', t); else localStorage.removeItem('msdk_token'); },
  loadToken() { this.token = localStorage.getItem('msdk_token'); return this.token; },
  async req(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (this.token) opts.headers['Authorization'] = 'Bearer ' + this.token;
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api'+path, opts);
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || 'خطأ ('+res.status+')');
    return data;
  },
  // auth
  register(name, password) { return this.req('POST', '/auth/register', { name, password }); },
  login(name, password)    { return this.req('POST', '/auth/login',    { name, password }); },
  me()                     { return this.req('GET',  '/auth/me'); },
  // game state
  loadState()              { return this.req('GET',  '/game/state'); },
  saveState(state)         { return this.req('POST', '/game/state',   { state }); },
  // market
  marketList(item, sort)   { const q = new URLSearchParams({ item: item||'all', sort: sort||'priceAsc' }); return this.req('GET', '/market?'+q); },
  marketStats()            { return this.req('GET',  '/market/stats'); },
  marketMine()             { return this.req('GET',  '/market/mine'); },
  listItem(item, qty, price) { return this.req('POST', '/market/list', { item, qty, price }); },
  buyListing(id)           { return this.req('POST', '/market/buy/'+id); },
  cancelListing(id)        { return this.req('POST', '/market/cancel/'+id); },
  // wallet
  wallet()                 { return this.req('GET',  '/wallet'); },
  deposit(amount, paymentToken) { return this.req('POST', '/wallet/deposit',  { amount, paymentToken }); },
  withdraw(amount, address)     { return this.req('POST', '/wallet/withdraw', { amount, address }); },
  // chat
  chatRecent()             { return this.req('GET',  '/chat/recent'); },
  // admin
  adminPlayers()           { return this.req('GET',  '/admin/players'); },
  adminStats()             { return this.req('GET',  '/admin/stats'); },
  adminLog()               { return this.req('GET',  '/admin/log'); },
  adminTransactions()      { return this.req('GET',  '/admin/transactions'); },
  adminAdjust(userId, amount, reason) { return this.req('POST', '/admin/adjust', { userId, amount, reason }); },

  connectSocket() {
    if (this.socket) this.socket.disconnect();
    this.socket = io({ auth: { token: this.token } });
    return this.socket;
  },
  disconnectSocket() {
    if (this.socket) { this.socket.disconnect(); this.socket = null; }
  },
};
API.loadToken();

/* ==================== ثوابت اللعبة ==================== */
const GRID_W = 18, GRID_H = 18, CELL = 56;
const SAVE_KEY = 'msdk_farm_v4';
const HOUR = 3600, DAY = 86400;

/* أوقات واقعية: قمح يوم - وقس عليه. السقي والسماد يخفّفان البطء */

  strawberry: { name:'فراولة',  emoji:'🍓', time: 3*DAY,    xp: 320,  unlockLevel: 10, baseValue: 400 },

  goatPen: {

/* قطعة الأرض - أول قطعة مجانية، ثم من 100K إلى 100M على 30 ترقية */
const LAND_MAX_PURCHASES = 30;
const landCostFor = (n) => {
  if (n === 0) return 0;                           // الأولى مجانية
  if (n >= LAND_MAX_PURCHASES) return 100000000;   // الحد الأقصى 100 مليون
  // منحنى أسي من 100K (n=1) إلى 100M (n=30) - 1000 ضعف على 29 خطوة
  const r = Math.pow(1000, 1 / (LAND_MAX_PURCHASES - 1));
  return Math.floor(100000 * Math.pow(r, n - 1));
};

function App(){

}

/* ==================== شاشة الدخول - تستخدم Backend ==================== */
function Login({onLogin}){
  const [mode, setMode] = useState('login'); // 'login' | 'register'
  const [name, setName] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  const submit = async () => {
    setError('');
    if (!name.trim() || !password) { setError('الاسم وكلمة المرور مطلوبان'); return; }
    setBusy(true);
    try {
      const fn = mode === 'login' ? API.login.bind(API) : API.register.bind(API);
      const r = await fn(name.trim(), password);
      API.setToken(r.token);
      onLogin(r.user);
    } catch(e) {
      setError(e.message);
    }
    setBusy(false);
  };

  return (
    <div className="login-screen">
      <div className="login-card">
        <div style={{fontSize:60}}>🚜</div>
        <h1>MSDK Farm</h1>
        <p>مزرعة العملة الرقمية - ازرع، اصنع، تاجر، اربح MSDK</p>

        <div style={{display:'flex',gap:6,marginBottom:10}}>
          <button className={`login-btn ${mode==='login'?'login-google':'login-guest'}`}
            style={{flex:1, background: mode==='login'?'#fff':'rgba(255,255,255,0.3)', color:mode==='login'?'#444':'#666'}}
            onClick={()=>setMode('login')}>🔑 تسجيل دخول</button>
          <button className={`login-btn ${mode==='register'?'login-guest':'login-google'}`}
            style={{flex:1, background: mode==='register'?'linear-gradient(180deg,#4caf50,#2e7d32)':'rgba(255,255,255,0.3)',
                   color:mode==='register'?'#fff':'#666'}}
            onClick={()=>setMode('register')}>🆕 حساب جديد</button>
        </div>

        <input className="input" value={name} onChange={(e)=>setName(e.target.value)}
          placeholder="اسم المستخدم..." maxLength={20} autoFocus
          onKeyDown={(e)=>{ if (e.key==='Enter') document.getElementById('pw-in')?.focus(); }} />
        <input id="pw-in" className="input" type="password" value={password}
          onChange={(e)=>setPassword(e.target.value)}
          placeholder="كلمة المرور..." style={{marginTop:6}}
          onKeyDown={(e)=>{ if (e.key==='Enter') submit(); }} />

        {error && <div style={{color:'#b71c1c',fontWeight:900,marginTop:8,fontSize:13}}>⚠️ {error}</div>}

        <button className="login-btn login-guest" disabled={busy}
          onClick={submit} style={{marginTop:12}}>
          {busy ? '⏳ جاري...' : (mode==='login' ? '🚪 دخول' : '✅ إنشاء حساب')}
        </button>

        <div style={{fontSize:10,marginTop:10,color:'#666'}}>
          🔐 الأدمن: استخدم اسم <b>admin</b> وكلمة المرور المضبوطة في الخادم
          <br/>💾 تقدمك يحفظ على الخادم - يمكنك الدخول من أي جهاز
        </div>
      </div>
    </div>
  );
}

/* ==================== اللعبة الرئيسية ==================== */
function Game({user, onLogout}){
  const [state, setState] = useState(null); // null = جاري التحميل
  const [now, setNow] = useState(Date.now());
  const [toast, setToast] = useState('');
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({x:0,y:0});
  const [panel, setPanel] = useState(null);
  const [panelTab, setPanelTab] = useState('build');
  const [selected, setSelected] = useState(null);
  const [placing, setPlacing] = useState(null);
  const [planting, setPlanting] = useState(null);
  const [factoryFor, setFactoryFor] = useState(null);
  const [penFor, setPenFor] = useState(null);
  const [stand, setStand] = useState(null);
  const [chatInput, setChatInput] = useState('');
  const [serverMarket, setServerMarket] = useState([]);   // عروض حقيقية من الخادم
  const [chatHistory, setChatHistory] = useState([]);     // رسائل من الخادم
  const dragRef = useRef(null);
  const sceneRef = useRef(null);
  const saveTimerRef = useRef(null);

  /* ====== جلب state من Backend ====== */
  useEffect(()=>{
    API.loadState().then(r => {
      if (r.state) {
        // ترحيل ودمج
        const data = r.state;
        setState({
          ...data,
          panel:null, selected:null, placing:null,
          myStand: data.myStand || Array(9).fill(null),
          walletHistory: data.walletHistory || [],
          missions: data.missions || [],
          missionsRefreshAt: data.missionsRefreshAt || 0,
          farmSize: data.farmSize || (14 + (data.landPlotsBought||0)),
          timeMul: data.timeMul ?? 1,
          crops: data.crops || {},
          products: data.products || {},
          unlockedCrops: data.unlockedCrops || ['wheat'],
          buildings: data.buildings || [],
          nextId: data.nextId || 100,
          msdk: data.msdk ?? 800, xp: data.xp ?? 0, level: data.level ?? 1,
          landPlotsBought: data.landPlotsBought || 0,
          adminLog: data.adminLog || [],
        });
      } else {
        // قرية جديدة
        setState(makeFreshState(user));
      }
    }).catch(err => {
      console.error('فشل تحميل اللعبة:', err);
      setState(makeFreshState(user));
    });
  }, [user.id]);

  /* ====== Socket.IO للسوق والدردشة ====== */
  useEffect(()=>{
    const socket = API.connectSocket();
    socket.on('connect', ()=> console.log('🔌 متصل بالخادم'));
    socket.on('disconnect', ()=> console.log('❌ انقطع الاتصال'));

    socket.on('chat:msg', (msg) => {
      setChatHistory(h => [...h, { ...msg, id:'srv_'+msg.time, me: msg.user_id === user.id, bot: false }].slice(-50));
    });
    socket.on('market:update', () => { refreshMarket(); });
    socket.on('notify', (n) => {
      setToast(n.msg);
      setTimeout(()=>setToast(''), 4000);
      // أعد تحميل state عند بيع شيء
      if (n.type === 'sale') refreshState();
    });
    socket.on('presence', (p) => { /* console.log('presence', p); */ });

    // تحميل أولي للدردشة والسوق
    API.chatRecent().then(r => {
      const msgs = (r.messages||[]).map(m => ({...m, id:'srv_'+m.time, me: m.user_id === user.id}));
      setChatHistory(msgs);
    });
    refreshMarket();

    return () => API.disconnectSocket();
  }, [user.id]);

  const refreshMarket = useCallback(()=>{
    API.marketList('all', 'priceAsc').then(r => setServerMarket(r.listings||[])).catch(()=>{});
  }, []);

  const refreshState = useCallback(()=>{
    API.loadState().then(r => { if (r.state) setState(s => ({...s, ...r.state, panel:s?.panel, selected:s?.selected, placing:s?.placing })); });
  }, []);

  /* ====== الحفظ التلقائي على Backend (debounced) ====== */
  useEffect(()=>{
    if (!state) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(()=>{
      const toSave = {
        msdk: state.msdk, xp: state.xp, level: state.level,
        buildings: state.buildings, nextId: state.nextId,
        crops: state.crops, products: state.products,
        unlockedCrops: state.unlockedCrops, landPlotsBought: state.landPlotsBought,
        myStand: state.myStand, walletHistory: state.walletHistory,
        missions: state.missions, missionsRefreshAt: state.missionsRefreshAt,
        farmSize: state.farmSize, timeMul: state.timeMul,
        adminLog: state.adminLog,
      };
      API.saveState(toSave).catch(err => console.error('فشل الحفظ:', err));
    }, 1500);
    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [state]);

  /* ====== ساعة اللعبة ====== */
  useEffect(()=>{
    const t = setInterval(()=>setNow(Date.now()), 1000);
    return ()=>clearInterval(t);
  },[]);

  /* ====== تحديث السوق دورياً (كل 30 ثانية) ====== */
  useEffect(()=>{
    const t = setInterval(refreshMarket, 30_000);
    return ()=>clearInterval(t);
  },[]);

  /* ====== Pan / Zoom ====== */
  useEffect(()=>{
    const onWheel = (e)=>{
      e.preventDefault();
      setZoom(z => Math.max(0.3, Math.min(1.5, z - e.deltaY*0.001)));
    };
    const w = sceneRef.current;
    if (w) w.addEventListener('wheel', onWheel, {passive:false});
    return ()=>{ if (w) w.removeEventListener('wheel', onWheel); };
  },[]);
  const onPanStart = (e)=>{
    if (placing || planting || factoryFor || penFor || stand) return;
    const p = e.touches ? e.touches[0] : e;
    dragRef.current = { startX:p.clientX, startY:p.clientY, panX:pan.x, panY:pan.y, moved:false };
  };
  const onPanMove = (e)=>{
    if (!dragRef.current) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - dragRef.current.startX;
    const dy = p.clientY - dragRef.current.startY;
    if (Math.abs(dx)>4 || Math.abs(dy)>4) dragRef.current.moved = true;
    setPan({ x: dragRef.current.panX+dx, y: dragRef.current.panY+dy });
  };
  const onPanEnd = ()=>{ dragRef.current=null; };

  /* ====== مساعدات ====== */
  const showToast = (msg)=>{ setToast(msg); setTimeout(()=>setToast(''), 2200); };
  const flyText = (text, x, y, color='#ffd54f')=>{
    const div = document.createElement('div');
    div.className = 'fly';
    div.style.left = (x||window.innerWidth/2)+'px'; div.style.top = (y||100)+'px'; div.style.color = color;
    div.textContent = text; document.body.appendChild(div);
    setTimeout(()=>div.remove(), 1100);
  };
  const fmt = (n)=> n.toLocaleString('en-US');
  const fmtTime = (s)=>{
    s = Math.max(0, Math.floor(s));
    if (s < 60) return s+' ث';
    if (s < 3600) return Math.floor(s/60)+'د '+(s%60)+'ث';
    if (s < DAY) return Math.floor(s/3600)+'س '+Math.floor((s%3600)/60)+'د';
    return Math.floor(s/DAY)+'ي '+Math.floor((s%DAY)/3600)+'س';
  };
  const tMul = (state && state.timeMul) || 1;

  /* ====== مساعدات شبكة ====== */
  const cellsOf = (b)=>{
    const def = defOf(b.type); const sz = def.size||1;
    const arr = [];
    for (let dx=0; dx<sz; dx++) for (let dy=0; dy<sz; dy++) arr.push(`${b.x+dx},${b.y+dy}`);
    return arr;
  };
  const isOccupied = (x, y, size, ignoreId=null)=>{
    const cells = new Set();
    state.buildings.forEach(b => { if (b.id !== ignoreId) cellsOf(b).forEach(c => cells.add(c)); });
    for (let dx=0; dx<size; dx++) for (let dy=0; dy<size; dy++) {
      if (cells.has(`${x+dx},${y+dy}`)) return true;
    }
    return false;
  };
  const inBounds = (x, y, size)=>{
    const lim = state.farmSize || 12;
    return x>=0 && y>=0 && x+size<=lim && y+size<=lim;
  };

  /* ====== XP & مستوى ====== */
  const addXP = (amount, _state=null)=>{
    setState(s => {
      let xp = s.xp + amount, level = s.level;
      let need = xpForLevel(level);
      let newCrops = {...s.crops};
      let newUnlocked = [...s.unlockedCrops];
      while (xp >= need) {
        xp -= need; level += 1; need = xpForLevel(level);
        // فتح محاصيل جديدة + 1 من المحصول مجاناً (يستخدم للزراعة أو البيع)
        Object.entries(CROPS).forEach(([key,c])=>{
          if (c.unlockLevel === level && !newUnlocked.includes(key)) {
            newUnlocked.push(key);
            newCrops[key] = (newCrops[key]||0) + 1;
            showToast(`🎁 محصول جديد: ${c.name} - +1 ${c.name} مجاناً`);
          }
        });
        showToast(`🎉 وصلت المستوى ${level}!`);
      }
      return { ...s, xp, level, crops: newCrops, unlockedCrops: newUnlocked };
    });
  };

  /* ====== جرد - مساعد ====== */
  const totalInv = ()=>{
    return Object.values(state.crops).reduce((a,b)=>a+b,0)
         + Object.values(state.products).reduce((a,b)=>a+b,0);
  };
  const invCap = ()=>{
    const silos = state.buildings.filter(b => b.type === 'silo');
    return SILO_BASE_CAP + silos.reduce((a,s)=>a + (s.level||1) * 50, 0);
  };

  /* ====== شراء أرض ====== */
  const buyLand = ()=>{
    if (state.landPlotsBought >= LAND_MAX_PURCHASES) {
      showToast('🏆 وصلت الحد الأقصى من الأراضي!'); return;
    }
    const cost = landCostFor(state.landPlotsBought);
    if (cost > 0 && state.msdk < cost) {
      showToast(`💸 يحتاج ${fmt(cost)} MSDK`); return;
    }
    if (cost > 0 && !confirm(`شراء قطعة الأرض رقم ${state.landPlotsBought+1} بسعر ${fmt(cost)} MSDK؟`)) return;
    setState(s => ({
      ...s, msdk: s.msdk - cost,
      landPlotsBought: s.landPlotsBought + 1,
      farmSize: (s.farmSize||12) + 1,  // كل ترقية تزيد صف وعمود
    }));
    showToast(cost === 0 ? '🎁 قطعة الأرض الأولى مجانية!' : `✅ وسعت أرضك! +1 صف وعمود`);
    addXP(cost === 0 ? 10 : 50);
    pushAdminLog('بيع أرض بسعر '+fmt(cost));
  };

  /* ====== بناء ====== */
  const startBuild = (type)=>{
    const def = defOf(type);
    if (def.unlockLevel && state.level < def.unlockLevel) {
      showToast(`🔒 يحتاج المستوى ${def.unlockLevel}`); return;
    }
    const cost = def.baseCost || def.cost || 0;
    if (state.msdk < cost) { showToast('💸 لا يكفي MSDK'); return; }
    setPlacing({ type, fromId:null });
    setPanel(null); setSelected(null);
  };
  const startMove = (b)=>{ setPlacing({ type:b.type, fromId:b.id }); setSelected(null); };
  const tryPlace = (gx, gy)=>{
    if (!placing) return;
    const def = defOf(placing.type); const size = def.size || 1;
    if (!inBounds(gx, gy, size)) { showToast('❌ خارج الحدود - اشتري أرضاً أكبر'); return; }
    if (isOccupied(gx, gy, size, placing.fromId)) { showToast('❌ المكان مشغول'); return; }
    if (placing.fromId) {
      setState(s => ({ ...s,
        buildings: s.buildings.map(b => b.id === placing.fromId ? { ...b, x:gx, y:gy } : b),
      }));
    } else {
      const cost = def.baseCost || def.cost || 0;
      const newB = {
        id: state.nextId, type: placing.type, level: 1, x:gx, y:gy,
        ...(def.isPlot ? { planted:null, plantedAt:0, lastWatered:0, missedWaters:0,
                           harvestsSinceFert:0, fertilized:false, dead:false } : {}),
        ...(PEN_TYPES[placing.type] ? { animals:[] } : {}),
        ...(FACTORIES[placing.type] ? { queue:[] } : {}),
        ...(placing.type === 'silo' ? { lastCollect: 0 } : {}),
      };
      setState(s => ({ ...s, msdk: s.msdk - cost,
        buildings: [...s.buildings, newB], nextId: s.nextId+1 }));
      addXP(15);
      showToast(`✅ تم بناء ${def.name}`);
      pushAdminLog('بناء '+def.name+' بسعر '+fmt(cost));
    }
    setPlacing(null);
  };

  /* ====== هدم - بدون استرداد ====== */
  const removeBld = (b)=>{
    if (b.type === 'townhall') return;
    if (!confirm(`هدم ${defOf(b.type).name}؟\n⚠️ لن يتم استرداد أي مبلغ!`)) return;
    setState(s => ({ ...s,
      buildings: s.buildings.filter(x => x.id !== b.id) }));
    setSelected(null);
    setPenFor(null); setFactoryFor(null);
    showToast(`🗑️ هدمت ${defOf(b.type).name}`);
  };

  /* ====== ترقية حضيرة / صومعة - مع تأكيد للمبلغ ====== */
  const upgradePen = (b)=>{
    const def = PEN_TYPES[b.type];
    const maxCap = 5;
    const currentCap = def.baseCap + (b.level-1) * def.capPerLevel;
    if (currentCap >= maxCap) { showToast('💎 الحد الأقصى لسعة الحضيرة هو 5'); return; }
    const cost = def.upgradeCost(b.level);
    if (state.msdk < cost) { showToast(`💸 يحتاج ${fmt(cost)} MSDK`); return; }
    if (!confirm(`ترقية ${def.name} إلى المستوى ${b.level+1}؟\nالسعة: ${currentCap} → ${Math.min(maxCap, currentCap+def.capPerLevel)}\nالسعر: ${fmt(cost)} MSDK`)) return;
    setState(s => ({ ...s, msdk: s.msdk - cost,
      buildings: s.buildings.map(x => x.id === b.id ? { ...x, level: x.level+1 } : x) }));
    addXP(80);
    showToast(`⬆️ ${def.name} → م${b.level+1}`);
  };
  const upgradeSilo = (b)=>{
    const cost = Math.floor(SILO_BASE_COST * Math.pow(1.6, b.level));
    if (state.msdk < cost) { showToast(`💸 يحتاج ${fmt(cost)} MSDK`); return; }
    if (!confirm(`ترقية الصومعة إلى م${b.level+1}؟\nسعة إضافية: +50\nالسعر: ${fmt(cost)} MSDK`)) return;
    setState(s => ({ ...s, msdk: s.msdk - cost,
      buildings: s.buildings.map(x => x.id === b.id ? { ...x, level: x.level+1 } : x) }));
    addXP(60);
    showToast(`⬆️ صومعة م${b.level+1} - سعة +50`);
  };
  /* ترقية مصنع - تزيد سعة الطابور (max 5) */
  const upgradeFactory = (b)=>{
    const f = FACTORIES[b.type]; if (!f) return;
    const currentCap = (b.queueCap || 3);
    if (currentCap >= 5) { showToast('💎 الحد الأقصى لطابور المصنع هو 5'); return; }
    const cost = Math.floor((f.baseCost || 1000) * 0.6 * Math.pow(1.7, currentCap - 3));
    if (state.msdk < cost) { showToast(`💸 يحتاج ${fmt(cost)} MSDK`); return; }
    if (!confirm(`ترقية ${f.name}؟\nطابور إنتاج: ${currentCap} → ${currentCap+1}\nالسعر: ${fmt(cost)} MSDK`)) return;
    setState(s => ({ ...s, msdk: s.msdk - cost,
      buildings: s.buildings.map(x => x.id === b.id ? { ...x, queueCap: currentCap+1 } : x) }));
    addXP(120);
    showToast(`⬆️ ${f.name} - طابور ${currentCap+1}`);
  };

  /* ====== زراعة - حصاد - سقي - تسميد ====== */
  const openPlanting = (b)=>{
    if (b.dead) { showToast('☠️ النبات ميت! انقر "تنظيف" لإعادة الزراعة'); return; }
    setPlanting(b.id); setSelected(null);
  };
  const cleanDeadPlot = (b)=>{
    setState(s => ({ ...s, buildings: s.buildings.map(x => x.id === b.id
      ? {...x, planted:null, dead:false, missedWaters:0, harvestsSinceFert:0, fertilized:false } : x) }));
    setSelected(null);
    showToast('🧹 نظفت الأرض - يمكنك الزراعة');
  };
  const plantSeed = (plotId, cropKey)=>{
    const have = state.crops[cropKey]||0;
    if (have <= 0) { showToast(`❌ لا تملك ${CROPS[cropKey].name} - اشتر من السوق أو احصد`); return; }
    const newCrops = { ...state.crops, [cropKey]: have-1 };
    if (newCrops[cropKey] <= 0) delete newCrops[cropKey];
    setState(s => ({ ...s,
      crops: newCrops,
      buildings: s.buildings.map(b => b.id === plotId
        ? { ...b, planted: cropKey, plantedAt: Date.now(),
            lastWatered: 0, fertilized: (b.harvestsSinceFert >= 5 ? false : b.fertilized) } : b) }));
    setPlanting(null);
    showToast(`🌱 زرعت ${CROPS[cropKey].name}`);
  };
  const waterPlot = (b)=>{
    if (!b.planted || b.dead) return;
    const cost = 50;
    if (state.msdk < cost) { showToast(`💸 السقي ${cost} MSDK`); return; }
    if (!confirm(`سقي القطعة بـ ${cost} MSDK؟ (فعّال لـ 5 حصادات)`)) return;
    setState(s => ({ ...s, msdk: s.msdk - cost,
      buildings: s.buildings.map(x => x.id === b.id
        ? {...x, lastWatered: Date.now(), waterHarvestsLeft: 5, missedWaters: 0} : x) }));
    showToast('💧 سقيت - +20% سرعة لـ 5 حصادات');
    setSelected(null);
  };
  const fertilizePlot = (b)=>{
    const cost = 50;
    if (state.msdk < cost) { showToast(`💸 السماد ${cost} MSDK`); return; }
    if (!confirm(`سماد الأرض بـ ${cost} MSDK؟ (فعّال لـ 5 حصادات)`)) return;
    setState(s => ({ ...s, msdk: s.msdk - cost,
      buildings: s.buildings.map(x => x.id === b.id
        ? {...x, fertilized:true, fertHarvestsLeft: 5, harvestsSinceFert:0} : x) }));
    showToast('🌿 سمدت - مضاعف الناتج لـ 5 حصادات');
    setSelected(null);
  };
  /* حساب وقت النمو الفعلي - السقي والسماد محسوبان بعدد الحصادات المتبقية */
  const effectiveGrowTime = (b)=>{
    const c = CROPS[b.planted]; if (!c) return 0;
    const baseTime = c.time * tMul;
    const watered = (b.waterHarvestsLeft||0) > 0;
    const fertBoost = b.fertilized ? 0.85 : 1.0;
    const waterBoost = watered ? 0.8 : 1.0;
    return baseTime * fertBoost * waterBoost;
  };
  const harvestPlot = (b, evt)=>{
    if (!b.planted || b.dead) return;
    const c = CROPS[b.planted];
    const elapsed = (Date.now() - b.plantedAt)/1000;
    if (elapsed < effectiveGrowTime(b)) return;
    if (totalInv() >= invCap()) { showToast('❌ المخزون ممتلئ - بِع أو اشترِ صومعة'); return; }

    const wasWatered = (b.waterHarvestsLeft||0) > 0;
    let newWaterLeft = Math.max(0, (b.waterHarvestsLeft||0) - 1);
    let newFertLeft  = Math.max(0, (b.fertHarvestsLeft||0) - 1);

    // إن لم يُسقَ في حصاد ما، يزيد عداد فقدان السقي
    let newMissed = b.missedWaters || 0;
    if (!wasWatered) newMissed += 1; else newMissed = 0;
    let dead = newMissed >= 3;

    // الإنتاج: إذا مسمد ×2، عادي ×1
    let yieldQty = (b.fertHarvestsLeft||0) > 0 ? 2 : 1;
    let fertilized = newFertLeft > 0;

    if (yieldQty > 0) {
      flyText(`+${yieldQty} ${c.emoji}`, evt?.clientX, evt?.clientY, '#fff176');
    }
    setState(s => ({ ...s,
      crops: { ...s.crops, [b.planted]: (s.crops[b.planted]||0) + yieldQty },
      buildings: s.buildings.map(x => x.id === b.id
        ? {...x, planted:null, plantedAt:0,
            waterHarvestsLeft: newWaterLeft,
            fertHarvestsLeft: newFertLeft,
            missedWaters:newMissed,
            fertilized, dead} : x) }));
    addXP(c.xp);
    if (dead) showToast('☠️ النبات مات! نسيت السقي 3 مرات');
  };

  /* ====== إدارة الحضيرة (شراء/بيع حيوانات) ====== */
  const openPenMgmt = (b)=>{ setPenFor(b.id); setSelected(null); };
  const buyAnimal = (penId)=>{
    const b = state.buildings.find(x => x.id === penId);
    if (!b) return;
    const def = PEN_TYPES[b.type]; const a = ANIMALS[def.animal];
    const cap = def.baseCap + (b.level-1) * def.capPerLevel;
    if ((b.animals||[]).length >= cap) { showToast('❌ الحضيرة ممتلئة - رقّها'); return; }
    if (state.msdk < a.cost) { showToast(`💸 يحتاج ${fmt(a.cost)} MSDK`); return; }
    setState(s => ({ ...s, msdk: s.msdk - a.cost,
      buildings: s.buildings.map(x => x.id === penId
        ? { ...x, animals: [...(x.animals||[]), { id: Date.now()+Math.random(), addedAt:Date.now(), lastCollect:Date.now() }] }
        : x) }));
    showToast(`✅ اشتريت ${a.name}`);
    addXP(20);
  };
  const sellAnimal = (penId, animalId)=>{
    const b = state.buildings.find(x => x.id === penId);
    if (!b) return;
    const def = PEN_TYPES[b.type]; const a = ANIMALS[def.animal];
    const refund = Math.floor(a.cost * 0.6);
    setState(s => ({ ...s, msdk: s.msdk + refund,
      buildings: s.buildings.map(x => x.id === penId
        ? { ...x, animals: x.animals.filter(an => an.id !== animalId) } : x) }));
    showToast(`💰 بعت ${a.name} مقابل ${fmt(refund)} MSDK`);
  };
  const collectFromAnimal = (penId, animalId, evt)=>{
    const b = state.buildings.find(x => x.id === penId); if (!b) return;
    const def = PEN_TYPES[b.type]; const a = ANIMALS[def.animal];
    const animal = b.animals.find(an => an.id === animalId); if (!animal) return;
    const elapsed = (Date.now() - animal.lastCollect)/1000;
    if (elapsed < a.cycle * tMul) return;
    if (totalInv() >= invCap()) { showToast('❌ المخزون ممتلئ'); return; }
    flyText(`+1 ${a.pEmoji}`, evt?.clientX, evt?.clientY, '#81d4fa');
    setState(s => ({ ...s,
      crops: { ...s.crops, [a.pName]: (s.crops[a.pName]||0) + 1 },
      buildings: s.buildings.map(x => x.id === penId
        ? { ...x, animals: x.animals.map(an => an.id === animalId ? {...an, lastCollect:Date.now()} : an) }
        : x) }));
    addXP(a.xp);
  };

  /* ====== المصانع - بدء/جمع وصفة ====== */
  const openFactory = (b)=>{ setFactoryFor(b.id); setSelected(null); };
  const startRecipe = (factoryId, recipeId)=>{
    const b = state.buildings.find(x => x.id === factoryId); if (!b) return;
    const f = FACTORIES[b.type]; const r = f.recipes.find(rc => rc.id === recipeId); if (!r) return;
    const qCap = b.queueCap || 3;
    if ((b.queue||[]).length >= qCap) { showToast(`❌ الطابور ممتلئ (${qCap})`); return; }
    // تحقق من المواد
    const have = {...state.crops, ...state.products};
    for (const [k,n] of Object.entries(r.in)) {
      if ((have[k]||0) < n) { showToast(`❌ تحتاج ${n} ${PRODUCTS[k]||k}`); return; }
    }
    // اخصم
    const newCrops = {...state.crops}, newProducts = {...state.products};
    for (const [k,n] of Object.entries(r.in)) {
      if (newCrops[k]) newCrops[k] -= n;
      else if (newProducts[k]) newProducts[k] -= n;
      if (newCrops[k]<=0) delete newCrops[k];
      if (newProducts[k]<=0) delete newProducts[k];
    }
    setState(s => ({ ...s, crops: newCrops, products: newProducts,
      buildings: s.buildings.map(x => x.id === factoryId
        ? { ...x, queue: [...(x.queue||[]), { recipeId, startedAt: Date.now() }] } : x) }));
    showToast('🏭 بدأ التصنيع...');
  };
  const collectRecipe = (factoryId, queueIdx)=>{
    const b = state.buildings.find(x => x.id === factoryId); if (!b) return;
    const f = FACTORIES[b.type]; const item = b.queue[queueIdx];
    const r = f.recipes.find(rc => rc.id === item.recipeId);
    if (!r) return;
    const elapsed = (Date.now() - item.startedAt)/1000;
    if (elapsed < r.time * tMul) return;
    if (totalInv() >= invCap()) { showToast('❌ المخزون ممتلئ'); return; }
    const newProducts = {...state.products};
    for (const [k,n] of Object.entries(r.out)) {
      newProducts[k] = (newProducts[k]||0) + n;
    }
    setState(s => ({ ...s, products: newProducts,
      buildings: s.buildings.map(x => x.id === factoryId
        ? { ...x, queue: x.queue.filter((_,i) => i !== queueIdx) } : x) }));
    addXP(r.xp);
    flyText(`+${Object.values(r.out)[0]} ${PRODUCT_EMOJI[Object.keys(r.out)[0]]}`, null, null, '#ffd54f');
    showToast(`✅ ${PRODUCTS[Object.keys(r.out)[0]]} جاهز!`);
  };

  /* ====== المتجر / كشك البيع (9 صناديق) ====== */
  const openStandSlot = (idx)=>{
    const slot = state.myStand[idx];
    if (slot && slot.status === 'sold') {
      // اجمع الأموال
      setState(s => ({ ...s, msdk: s.msdk + slot.price * slot.qty,
        myStand: s.myStand.map((sl,i) => i===idx ? null : sl),
        walletHistory: [{
          id: 'sale_'+Date.now(), type:'بيع', amount: slot.price*slot.qty,
          item: slot.item, time: Date.now(), note:'بيع لـ '+(slot.soldTo||'لاعب')
        }, ...(s.walletHistory||[])].slice(0,50),
      }));
      flyText(`+${fmt(slot.price*slot.qty)} 🪙`, null, null, '#ffd54f');
      showToast(`💰 جمعت ${fmt(slot.price*slot.qty)} MSDK من البيع`);
      return;
    }
    if (slot && slot.status === 'listed') {
      // إلغاء؟
      if (!confirm('إلغاء عرض البيع وإرجاع السلعة للمخزون؟')) return;
      const targetCat = state.crops[slot.item] !== undefined ? 'crops' : 'products';
      setState(s => ({ ...s,
        [targetCat]: { ...s[targetCat], [slot.item]: (s[targetCat][slot.item]||0) + slot.qty },
        myStand: s.myStand.map((sl,i) => i===idx ? null : sl) }));
      showToast('🔙 ألغيت البيع وأُعيدت السلعة');
      return;
    }
    // فارغ → افتح modal اختيار السلعة
    setStand({ idx });
  };
  const listInStand = (idx, item, qty, price)=>{
    if (qty <= 0 || price <= 0) { showToast('❌ كمية أو سعر غير صحيح'); return; }
    const cat = state.crops[item] !== undefined ? 'crops' : 'products';
    if ((state[cat][item]||0) < qty) { showToast('❌ ليس لديك ما يكفي'); return; }
    const newCat = { ...state[cat], [item]: state[cat][item] - qty };
    if (newCat[item] <= 0) delete newCat[item];
    setState(s => ({ ...s,
      [cat]: newCat,
      myStand: s.myStand.map((sl,i) => i===idx
        ? { item, qty, price, status:'listed', listedAt:Date.now() } : sl) }));
    showToast(`📌 عُرض ${qty} ${PRODUCTS[item]||item} بسعر ${fmt(price)} MSDK`);
    setStand(null);
  };

  /* ====== شراء من السوق - عبر Backend ====== */
  const buyFromMarket = async (listing)=>{
    if (state.msdk < listing.price * listing.qty) { showToast('💸 لا يكفي MSDK'); return; }
    if (totalInv() + listing.qty > invCap()) { showToast('❌ المخزون لن يستوعب'); return; }
    try {
      await API.buyListing(listing.id);
      showToast(`✅ اشتريت ${listing.qty} ${PRODUCTS[listing.item]||listing.item} من ${listing.seller_name}`);
      // أعد تحميل الـ state من الخادم لمزامنة المخزون والرصيد
      refreshState();
      refreshMarket();
    } catch(e) {
      showToast('❌ '+e.message);
    }
  };

  /* ====== عرض سلعة في الكشك - عبر Backend ====== */
  const listInStandReal = async (idx, item, qty, price) => {
    try {
      await API.listItem(item, qty, price);
      showToast(`📌 عُرض ${qty}× ${PRODUCTS[item]||item} في السوق العالمي`);
      // أعد تحميل الـ state ليُحدث المخزون
      refreshState();
      refreshMarket();
      setStand(null);
    } catch(e) {
      showToast('❌ '+e.message);
    }
  };

  /* ====== المهام ====== */
  useEffect(()=>{
    if (!state) return;
    if (Date.now() > state.missionsRefreshAt && state.missions.length < 3) {
      const newMissions = [];
      for (let i=state.missions.length; i<3; i++) {
        const tpl = MISSION_TEMPLATES[Math.floor(Math.random()*MISSION_TEMPLATES.length)];
        const baseVal = baseValueOf(tpl.item) * tpl.qty;
        const reward = Math.floor(baseVal * 0.70);
        newMissions.push({
          id: 'm_'+Date.now()+'_'+i,
          ...tpl, reward, xp: tpl.baseXP,
        });
      }
      setState(s => ({ ...s, missions: [...s.missions, ...newMissions],
        missionsRefreshAt: Date.now() + 4*HOUR*1000 }));
    }
  }, [state?.missions?.length, state?.missionsRefreshAt]);
  const completeMission = (mId)=>{
    const m = state.missions.find(x => x.id === mId); if (!m) return;
    const cat = CROPS[m.item] ? 'crops' : 'products';
    if ((state[cat][m.item]||0) < m.qty) { showToast(`❌ تحتاج ${m.qty} ${PRODUCTS[m.item]}`); return; }
    const newCat = { ...state[cat], [m.item]: state[cat][m.item] - m.qty };
    if (newCat[m.item] <= 0) delete newCat[m.item];
    setState(s => ({ ...s, msdk: s.msdk + m.reward,
      [cat]: newCat,
      missions: s.missions.filter(x => x.id !== mId),
      walletHistory: [{
        id:'mis_'+Date.now(), type:'مكافأة مهمة', amount: m.reward,
        item: m.item, time: Date.now(), note:'مهمة: '+m.qty+' '+PRODUCTS[m.item]
      }, ...(s.walletHistory||[])].slice(0,50),
    }));
    addXP(m.xp);
    showToast(`🏆 مهمة منجزة! +${fmt(m.reward)} MSDK`);
    pushAdminLog('مهمة منجزة: '+fmt(m.reward));
  };

  /* ====== المحفظة - عبر Backend ====== */
  const depositMSDK = async (amount)=>{
    amount = parseInt(amount, 10);
    if (!amount || amount <= 0) { showToast('❌ أدخل مبلغاً صحيحاً'); return; }
    try {
      await API.deposit(amount);
      showToast(`💎 تم شحن ${fmt(amount)} MSDK`);
      refreshState();
    } catch(e) { showToast('❌ '+e.message); }
  };
  const withdrawMSDK = async (amount, address='wallet')=>{
    amount = parseInt(amount, 10);
    if (!amount || amount <= 0) return;
    if (state.msdk < amount) { showToast('❌ رصيد غير كاف'); return; }
    try {
      await API.withdraw(amount, address);
      showToast(`💸 طلب سحب ${fmt(amount)} MSDK (قيد المعالجة)`);
      refreshState();
    } catch(e) { showToast('❌ '+e.message); }
  };

  /* ====== دردشة ====== */
  const sendChat = ()=>{
    if (!chatInput.trim()) return;
    if (API.socket) API.socket.emit('chat:send', { text: chatInput.trim() });
    setChatInput('');
  };

  /* ====== سجل الأدمن ====== */
  const pushAdminLog = (msg)=>{
    setState(s => ({ ...s, adminLog: [{
      id: Date.now()+'_'+Math.random(), time: Date.now(), msg, user: user.name
    }, ...(s.adminLog||[])].slice(0, 100) }));
  };

  /* ====== إعادة لعبة جديدة ====== */
  const resetGame = ()=>{
    if (!confirm('بدء قرية جديدة؟ ستفقد كل التقدم!')) return;
    localStorage.removeItem(SAVE_KEY+'_'+user.name);
    location.reload();
  };

  /* ============== العرض ============== */
  // إذا لم يُحمّل state بعد، اعرض شاشة تحميل
  if (!state) return (
    <div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',
      background:'linear-gradient(135deg,#1b5e20,#ffa000)',color:'#fff',fontSize:24,fontWeight:900,flexDirection:'column'}}>
      <div style={{fontSize:60,marginBottom:10}}>🚜</div>
      جاري تحميل مزرعتك من الخادم...
      <div style={{fontSize:14,marginTop:10,opacity:0.8}}>{user.name}</div>
    </div>
  );
  const xpNeeded = xpForLevel(state.level);
  const groundW = (state.farmSize || 12) * CELL;
  const groundH = (state.farmSize || 12) * CELL;
  const cancelPlace = ()=>setPlacing(null);
  const isAdmin = user.type === 'admin';

  return (
    <div className="world"
      onMouseDown={onPanStart} onMouseMove={onPanMove}
      onMouseUp={onPanEnd} onMouseLeave={onPanEnd}
      onTouchStart={onPanStart} onTouchMove={onPanMove} onTouchEnd={onPanEnd}>

      <div className="scene" ref={sceneRef} style={{
        transform:`translate(-50%,-50%) translate(${pan.x}px,${pan.y}px) scale(${zoom}) rotateX(35deg) rotateZ(-2deg)`,
      }}>
        <div className="ground" style={{ width: groundW, height: groundH }}>
          {placing && Array.from({length: (state.farmSize||12)*(state.farmSize||12)}).map((_,i)=>{
            const w = state.farmSize || 12;
            const gx = i % w, gy = Math.floor(i/w);
            const def = defOf(placing.type);
            const ok = inBounds(gx, gy, def.size||1) && !isOccupied(gx, gy, def.size||1, placing.fromId);
            return <div key={`c-${gx}-${gy}`} className={`cell ${ok?'ok':'bad'}`}
              style={{ left: gx*CELL, top: gy*CELL, width: CELL, height: CELL }}
              onClick={(e)=>{ e.stopPropagation(); if (ok) tryPlace(gx, gy); }} />;
          })}

          {state.buildings.map(b=>{
            const def = defOf(b.type);
            const sz = (def.size||1) * CELL;
            const isPlot = def.isPlot;
            const isFactory = !!FACTORIES[b.type];
            const isPen = !!PEN_TYPES[b.type];
            const planted = isPlot && b.planted;
            const elapsedPlot = planted ? (Date.now() - b.plantedAt)/1000 : 0;
            const grown = planted && elapsedPlot >= effectiveGrowTime(b);
            // دجاجة جاهزة لأي حيوان
            const animalsReady = isPen && (b.animals||[]).filter(an =>
              (Date.now() - an.lastCollect)/1000 >= ANIMALS[PEN_TYPES[b.type].animal].cycle * tMul).length;
            const queueReady = isFactory && (b.queue||[]).filter(q =>
              (Date.now() - q.startedAt)/1000 >= FACTORIES[b.type].recipes.find(r => r.id === q.recipeId).time * tMul).length;
            const eSize = isPlot ? 30 : (28 + Math.min(b.level||1, 8) * 2);
            let plotClass = '';
            if (isPlot) {
              if (b.dead) plotClass = 'plot-dead';
              else if (!planted) plotClass = 'plot-empty';
              else if (grown) plotClass = 'plot-ready';
              else plotClass = 'plot-growing';
            }
            return (
              <div key={b.id} className="bld"
                style={{ left: b.x*CELL, top: b.y*CELL, width: sz, height: sz }}
                onClick={(e)=>{
                  e.stopPropagation();
                  if (placing) return;
                  if (dragRef.current && dragRef.current.moved) return;
                  if (isPlot) {
                    if (b.dead) setSelected(s => s===b.id ? null : b.id);
                    else if (!planted) openPlanting(b);
                    else if (grown) harvestPlot(b, e);
                    else setSelected(s => s===b.id ? null : b.id);
                  } else {
                    // مباني وحضائر ومصانع: اعرض القائمة فيها (نقل/هدم/تصنيع/ترقية)
                    setSelected(s => s===b.id ? null : b.id);
                  }
                }}>
                {isPlot && <div className={plotClass} style={{position:'absolute',inset:2,borderRadius:8}} />}
                {!isPlot && (def.size||1)===2 && (
                  <div style={{position:'absolute',inset:4,background:'rgba(255,255,255,0.06)',borderRadius:8}}/>
                )}
                <div className="bld-art" style={{ fontSize:eSize+'px', position:'relative', zIndex:2 }}>
                  {isPlot && b.dead ? '☠️' : (isPlot && planted ? CROPS[b.planted].emoji : (isPlot && !planted ? '➕' : def.emoji))}
                </div>
                {!isPlot && <div className="bld-base" />}
                {!def.decoration && !isPlot && (PEN_TYPES[b.type] || def.upgradeCost) &&
                  <div className="lvl-tag">م{b.level||1}</div>}
                {grown && <div className="ready-bubble">🌾 جاهز!</div>}
                {isPlot && planted && !grown && !b.dead && (
                  <div className="ready-bubble" style={{background:'linear-gradient(135deg,#a5d6a7,#66bb6a)',color:'#1b5e20'}}>
                    {fmtTime(effectiveGrowTime(b) - elapsedPlot)}
                  </div>)}
                {animalsReady > 0 && <div className="ready-bubble">{animalsReady} 🥚</div>}
                {queueReady > 0 && <div className="ready-bubble">{queueReady} 📦</div>}
                {selected === b.id && (
                  <div style={{position:'absolute', inset:-4, border:'3px solid #ffeb3b',
                    borderRadius: 10, animation: 'ringPulse 1s infinite', pointerEvents:'none', zIndex:3}}/>)}
              </div>
            );
          })}
        </div>
      </div>

      {/* الشريط العلوي */}
      <div className="topbar">
        <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
          <span className="stat-pill">🪙 {fmt(state.msdk)}</span>
          <span className="stat-pill stat-xp">⭐{state.level}</span>
          <div style={{display:'flex',alignItems:'center',gap:4,background:'rgba(0,0,0,0.4)',
                       padding:'3px 8px',borderRadius:14,border:'2px solid #4fc3f7',minWidth:140}}>
            <span style={{fontSize:10,color:'#fff',fontWeight:900}}>XP</span>
            <div style={{flex:1,height:8,background:'rgba(255,255,255,0.2)',borderRadius:4,overflow:'hidden'}}>
              <div style={{height:'100%',width:Math.min(100,(state.xp/xpNeeded)*100)+'%',
                           background:'linear-gradient(90deg,#4fc3f7,#1976d2)',transition:'width 0.4s'}}/>
            </div>
            <span style={{fontSize:10,color:'#fff',fontWeight:900}}>{state.xp}/{xpNeeded}</span>
          </div>
          <span className="stat-pill stat-inv">📦 {totalInv()}/{invCap()}</span>
          <span className="stat-pill" style={{fontSize:11}}>👤 {user.name}{isAdmin?' 👑':''}</span>
        </div>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          <button className="icon-btn" onClick={()=>setZoom(z=>Math.min(1.5, z+0.15))}>＋</button>
          <button className="icon-btn" onClick={()=>setZoom(z=>Math.max(0.3, z-0.15))}>−</button>
          <button className="icon-btn" onClick={()=>{ setZoom(1); setPan({x:0,y:0}); }}>⊙</button>
          <button className="icon-btn" onClick={onLogout} title="خروج"
            style={{background:'linear-gradient(180deg,#9e9e9e,#424242)',borderColor:'#212121'}}>🚪</button>
          <button className="icon-btn" onClick={resetGame} title="إعادة"
            style={{background:'linear-gradient(180deg,#f44336,#b71c1c)',borderColor:'#7f0000'}}>↺</button>
        </div>
      </div>

      {toast && <div className="toast">{toast}</div>}

      {placing && (
        <>
          <div className="placing-overlay" />
          <div className="place-banner">
            <span>🏗 وضع {defOf(placing.type).name}</span>
            <button onClick={cancelPlace} style={{padding:'3px 10px',borderRadius:8,
              background:'#fff',color:'#bf360c',border:'2px solid #fff',fontWeight:900,cursor:'pointer'}}>إلغاء ✖</button>
          </div>
        </>
      )}

      {/* أزرار سفلية - HUD */}
      <div className="hud-bottom">
        <button className="hud-btn" onClick={()=>{setPanel('build'); setPanelTab('plot');}}>🛒 سوق البناء</button>
        <button className="hud-btn" onClick={()=>setPanel('market')}>🏛 السوق العالمي</button>
        <button className="hud-btn" onClick={()=>setPanel('stand')}>🏪 كشكي ({state.myStand.filter(s=>s).length}/9)</button>
        <button className="hud-btn" onClick={()=>setPanel('missions')}>📋 المهام ({state.missions.length})</button>
        <button className="hud-btn" onClick={()=>setPanel('inventory')}>🎒 المخزون</button>
        <button className="hud-btn" onClick={()=>setPanel('wallet')}>💼 المحفظة</button>
        <button className="hud-btn" onClick={()=>setPanel('chat')}>💬 الدردشة</button>
        {isAdmin && <button className="hud-btn alert" onClick={()=>setPanel('admin')}>👑 الأدمن</button>}
        <button className="hud-btn" onClick={buyLand}
          style={state.landPlotsBought===0?{background:'linear-gradient(180deg,#a5d6a7,#2e7d32)',color:'#fff',borderColor:'#1b5e20'}:{}}>
          📐 شراء أرض {state.landPlotsBought===0
            ? '(مجاني! 🎁)'
            : state.landPlotsBought >= LAND_MAX_PURCHASES
              ? '(الحد الأقصى)'
              : '('+fmt(landCostFor(state.landPlotsBought))+' 🪙)'}
        </button>
      </div>

      {/* قائمة بذرة */}
      {planting && <PlantingModal
        plot={state.buildings.find(b => b.id === planting)}
        crops={CROPS} inventory={state.crops} unlocked={state.unlockedCrops}
        level={state.level} onPlant={(k)=>plantSeed(planting, k)}
        onClose={()=>setPlanting(null)} fmtTime={fmtTime} fmt={fmt} />}

      {/* قائمة مبنى مختار */}
      {selected && !placing && (() => {
        const b = state.buildings.find(x => x.id === selected); if (!b) return null;
        const def = defOf(b.type);
        const isPlot = def.isPlot;
        const isPen = !!PEN_TYPES[b.type];
        const isSilo = b.type === 'silo';
        const isFactory = !!FACTORIES[b.type];
        const showWater = isPlot && b.planted && !b.dead;
        const showFert = isPlot && !b.dead && (b.fertHarvestsLeft||0) === 0;
        const showClean = isPlot && b.dead;
        // حساب التكاليف للعرض
        const penCost = isPen ? PEN_TYPES[b.type].upgradeCost(b.level) : 0;
        const siloCost = isSilo ? Math.floor(SILO_BASE_COST * Math.pow(1.6, b.level)) : 0;
        const factCost = isFactory ? Math.floor((FACTORIES[b.type].baseCost || 1000) * 0.6 * Math.pow(1.7, ((b.queueCap||3) - 3))) : 0;
        const penMaxed = isPen && (PEN_TYPES[b.type].baseCap + (b.level-1)*PEN_TYPES[b.type].capPerLevel) >= 5;
        const factMaxed = isFactory && (b.queueCap||3) >= 5;
        return (
          <div className="bld-menu">
            <h4>{def.emoji} {def.name} {b.level && b.level>1 && `(م${b.level})`}</h4>
            {def.desc && <div style={{fontSize:11, marginBottom:6}}>{def.desc}</div>}
            {isPlot && b.planted && !b.dead && (
              <div style={{fontSize:11, marginBottom:6}}>
                🌱 {CROPS[b.planted].name} - {fmtTime(effectiveGrowTime(b) - (Date.now()-b.plantedAt)/1000)}
                {(b.waterHarvestsLeft||0) > 0 && ` • 💧 سقي ${b.waterHarvestsLeft}/5`}
                {(b.fertHarvestsLeft||0) > 0 && ` • 🌿 سماد ${b.fertHarvestsLeft}/5`}
                {b.missedWaters>0 && ` • ⚠️ سقي مفقود ${b.missedWaters}/3`}
              </div>
            )}
            {isPlot && b.dead && <div style={{fontSize:11,color:'#b71c1c',marginBottom:6}}>☠️ النبات ميت</div>}
            {isPen && (
              <div style={{fontSize:11, marginBottom:6}}>
                🐾 الحيوانات: {(b.animals||[]).length}/{PEN_TYPES[b.type].baseCap + (b.level-1)*PEN_TYPES[b.type].capPerLevel} (الأقصى 5)
              </div>
            )}
            {isFactory && (
              <div style={{fontSize:11, marginBottom:6}}>
                🏭 طابور: {(b.queue||[]).length}/{b.queueCap||3} (الأقصى 5)
              </div>
            )}
            <div className="row">
              {showWater && <button className="menu-btn mb-water" onClick={()=>waterPlot(b)}
                disabled={state.msdk < 50}>💧 سقي (50)</button>}
              {showFert && <button className="menu-btn mb-fert" onClick={()=>fertilizePlot(b)}
                disabled={state.msdk < 50}>🌿 سماد (50)</button>}
              {showClean && <button className="menu-btn mb-cl" onClick={()=>cleanDeadPlot(b)}>🧹 تنظيف</button>}
              {isPen && !penMaxed && <button className="menu-btn mb-up" onClick={()=>upgradePen(b)}
                disabled={state.msdk < penCost}>
                ⬆ ترقية ({fmt(penCost)} 🪙)
              </button>}
              {isPen && penMaxed && <span style={{fontSize:11,color:'#1b5e20',fontWeight:900}}>💎 الحد الأقصى</span>}
              {isSilo && <button className="menu-btn mb-up" onClick={()=>upgradeSilo(b)}
                disabled={state.msdk < siloCost}>
                ⬆ ترقية (+50 سعة، {fmt(siloCost)} 🪙)
              </button>}
              {isFactory && !factMaxed && <button className="menu-btn mb-up" onClick={()=>upgradeFactory(b)}
                disabled={state.msdk < factCost}>
                ⬆ ترقية طابور ({fmt(factCost)} 🪙)
              </button>}
              {isFactory && factMaxed && <span style={{fontSize:11,color:'#1b5e20',fontWeight:900}}>💎 طابور أقصى</span>}
              {isFactory && <button className="menu-btn mb-cl" onClick={()=>{ setSelected(null); openFactory(b); }}>🏭 تصنيع</button>}
              {isPen && <button className="menu-btn mb-cl" onClick={()=>{ setSelected(null); openPenMgmt(b); }}>🐾 إدارة</button>}
              <button className="menu-btn mb-mv" onClick={()=>startMove(b)}>↔ نقل</button>
              {b.type !== 'townhall' && <button className="menu-btn mb-rm" onClick={()=>removeBld(b)}>🗑 هدم</button>}
              <button className="menu-btn mb-cl" onClick={()=>setSelected(null)}>إغلاق</button>
            </div>
          </div>
        );
      })()}

      {/* لوحات */}
      {panel === 'build' && <BuildPanel state={state} setPanelTab={setPanelTab} panelTab={panelTab}
        startBuild={startBuild} onClose={()=>setPanel(null)} fmt={fmt}/>}
      {panel === 'market' && <MarketPanel listings={serverMarket} buyFromMarket={buyFromMarket}
        onClose={()=>setPanel(null)} fmt={fmt} fmtTime={fmtTime}/>}
      {panel === 'stand' && <StandPanel state={state} openStandSlot={openStandSlot}
        onClose={()=>setPanel(null)} fmt={fmt}/>}
      {panel === 'missions' && <MissionsPanel state={state} completeMission={completeMission}
        onClose={()=>setPanel(null)} fmt={fmt}/>}
      {panel === 'inventory' && <InventoryPanel state={state} totalInv={totalInv} invCap={invCap}
        onClose={()=>setPanel(null)} fmt={fmt}/>}
      {panel === 'wallet' && <WalletPanel state={state} user={user} depositMSDK={depositMSDK}
        withdrawMSDK={withdrawMSDK} onClose={()=>setPanel(null)} fmt={fmt}
        showToast={showToast} refreshState={refreshState}/>}
      {panel === 'chat' && <ChatPanel chatMessages={chatHistory} user={user} chatInput={chatInput}
        setChatInput={setChatInput} sendChat={sendChat} onClose={()=>setPanel(null)}/>}
      {panel === 'admin' && isAdmin && <AdminPanel state={state} setState={setState}
        onClose={()=>setPanel(null)} fmt={fmt}/>}

      {factoryFor && <FactoryModal
        building={state.buildings.find(b => b.id === factoryFor)} state={state}
        startRecipe={startRecipe} collectRecipe={collectRecipe}
        onClose={()=>setFactoryFor(null)} fmt={fmt} fmtTime={fmtTime} tMul={tMul}/>}

      {penFor && <PenModal building={state.buildings.find(b => b.id === penFor)}
        state={state} buyAnimal={buyAnimal} sellAnimal={sellAnimal}
        collectFromAnimal={collectFromAnimal} onClose={()=>setPenFor(null)}
        fmt={fmt} fmtTime={fmtTime} tMul={tMul}/>}

      {stand && <ListItemModal idx={stand.idx} state={state}
        onList={(item, qty, price)=>listInStandReal(stand.idx, item, qty, price)}
        onClose={()=>setStand(null)} fmt={fmt}/>}
    </div>
  );
}

/* ============== الدوال المساعدة ============== */
function defOf(type){
  return BUILD_DEFS[type] || PEN_TYPES[type] || FACTORIES[type] || DECORATIONS[type] ||
    {name:type, emoji:'?', size:1, baseCost:0};
}

const BUILD_DEFS = {
  townhall: { name:'مركز القرية', emoji:'🏯', size:2, baseCost:0, isTH:true,
              desc:'قلب القرية' },
  farmplot: { name:'قطعة أرض', emoji:'🟫', size:1, baseCost:0, isPlot:true,
              desc:'اضغطها لزرع البذور' },
  silo: { name:'صومعة', emoji:'🏭', size:2, baseCost: SILO_BASE_COST,
          unlockLevel: 4, desc:'تزيد سعة المخزن +50',
          upgradeCost: lvl => Math.floor(SILO_BASE_COST*Math.pow(1.6,lvl)) },
  fence: { name:'سور', emoji:'🪵', size:1, baseCost: 80, unlockLevel: 2 },
  road:  { name:'ممر', emoji:'🟫', size:1, baseCost: 50, unlockLevel: 1 },
};

/* قرية جديدة افتراضية */
function makeFreshState(user){
  const fp = (id, x, y) => ({ id, type:'farmplot', level:1, x, y, planted:null, plantedAt:0, lastWatered:0, missedWaters:0, harvestsSinceFert:0, fertilized:false, dead:false, waterHarvestsLeft:0, fertHarvestsLeft:0 });
  return {
    msdk: 800, xp: 0, level: 1,
    buildings: [
      { id:1, type:'townhall', level:1, x:6, y:6, lastCollect:Date.now() },
      fp(2, 3, 3), fp(3, 4, 3), fp(4, 3, 4), fp(5, 4, 4),
      { id:6, type:'tree',    level:1, x:1,  y:1 },
      { id:7, type:'tree',    level:1, x:12, y:1 },
      { id:8, type:'tree',    level:1, x:1,  y:12 },
      { id:9, type:'tree',    level:1, x:12, y:12 },
      { id:10,type:'flowers', level:1, x:9,  y:3 },
      { id:11,type:'flowers', level:1, x:10, y:3 },
      { id:12,type:'bush',    level:1, x:2,  y:8 },
      { id:13,type:'bush',    level:1, x:11, y:8 },
    ],
    nextId: 100, farmSize: 14,
    crops: { wheat: 3 }, products: {},
    unlockedCrops: ['wheat'], landPlotsBought: 0,
    myStand: Array(9).fill(null),
    walletHistory: [], missions: [], missionsRefreshAt: 0,
    adminLog: [], timeMul: 1,
  };
}

function initState(user){
  try {
    const saved = localStorage.getItem(SAVE_KEY+'_'+user.name);
    if (saved) {
      const data = JSON.parse(saved);
      // التطبيق المتقدم للمستخدم - نمو خلفي تم بالفعل لأن الوقت يحفظ في timestamps
      // قطع أرض جاهزة عند العودة بالفعل
      return {
        ...data, panel:null, selected:null, placing:null,
        myStand: data.myStand || Array(9).fill(null),
        npcListings: data.npcListings || [],
        npcRefreshAt: data.npcRefreshAt || 0,
        chatMessages: data.chatMessages || [],
        walletHistory: data.walletHistory || [],
        missions: data.missions || [],
        missionsRefreshAt: data.missionsRefreshAt || 0,
        adminLog: data.adminLog || [],
        farmSize: data.farmSize || (14 + (data.landPlotsBought||0)),
        timeMul: data.timeMul ?? 1,
        // ترحيل: دمج البذور القديمة في المحاصيل
        crops: (() => {
          const merged = { ...(data.crops || {}) };
          if (data.seeds) {
            for (const [k, n] of Object.entries(data.seeds)) {
              if (n > 0) merged[k] = (merged[k] || 0) + n;
            }
          }
          return merged;
        })(),
        products: data.products || {},
      };
    }
  } catch (e) { console.error(e); }
  // قرية افتراضية - تصميم جميل مثل Clash of Clans
  const initial = {
    msdk: 800, xp: 0, level: 1,
    buildings: [
      // المركز
      { id:1, type:'townhall', level:1, x:6, y:6, lastCollect:Date.now() },
      // 4 قطع أراضي زراعية حول المركز
      { id:2, type:'farmplot', level:1, x:3, y:3, planted:null, plantedAt:0, lastWatered:0, missedWaters:0, harvestsSinceFert:0, fertilized:false, dead:false },
      { id:3, type:'farmplot', level:1, x:4, y:3, planted:null, plantedAt:0, lastWatered:0, missedWaters:0, harvestsSinceFert:0, fertilized:false, dead:false },
      { id:4, type:'farmplot', level:1, x:3, y:4, planted:null, plantedAt:0, lastWatered:0, missedWaters:0, harvestsSinceFert:0, fertilized:false, dead:false },
      { id:5, type:'farmplot', level:1, x:4, y:4, planted:null, plantedAt:0, lastWatered:0, missedWaters:0, harvestsSinceFert:0, fertilized:false, dead:false },
      // زينة حول القرية لتبدو جميلة
      { id:6, type:'tree',     level:1, x:1,  y:1 },
      { id:7, type:'tree',     level:1, x:12, y:1 },
      { id:8, type:'tree',     level:1, x:1,  y:12 },

function BuildPanel({state, setPanelTab, panelTab, startBuild, onClose, fmt}){
  const cats = {
    plot: { label:'🟫 أراضٍ ومخازن', items:['farmplot','silo','fence','road'] },
    pen: { label:'🐾 حضائر', items: Object.keys(PEN_TYPES) },
    factory: { label:'🏭 مصانع', items: Object.keys(FACTORIES) },
    decor: { label:'🌷 زينة', items: Object.keys(DECORATIONS) },
  };
  const showInfo = (key)=>{
    const def = defOf(key);
    const cost = def.baseCost || def.cost || 0;
    let info = `${def.emoji} ${def.name}\nالسعر: ${fmt(cost)} MSDK`;
    if (def.desc) info += `\n${def.desc}`;
    if (def.unlockLevel) info += `\nيفتح في المستوى: ${def.unlockLevel}`;
    if (FACTORIES[key]) {
      info += `\n\nالوصفات:`;
      FACTORIES[key].recipes.forEach(r=>{
        const inS = Object.entries(r.in).map(([k,n])=>`${n}× ${PRODUCTS[k]||k}`).join('+');
        const outS = Object.entries(r.out).map(([k,n])=>`${n}× ${PRODUCTS[k]||k}`).join('+');
        info += `\n• ${inS} → ${outS} (${r.time/3600}س, ${fmt(r.value)} MSDK)`;
      });
    }
    if (PEN_TYPES[key]) {
      info += `\nسعة بداية: ${PEN_TYPES[key].baseCap}\n+${PEN_TYPES[key].capPerLevel} لكل ترقية\nحيوان: ${ANIMALS[PEN_TYPES[key].animal].name}`;
    }
    alert(info);
  };
  return (
    <div className="panel">
      <button className="close-x" onClick={onClose}>✖</button>
      <h3>🛒 سوق البناء</h3>
      <div className="panel-tabs">
        {Object.entries(cats).map(([k,c])=>(
          <button key={k} className={`panel-tab ${panelTab===k?'active':''}`}
            onClick={()=>setPanelTab(k)}>{c.label}</button>
        ))}
      </div>
      <div className="panel-grid">
        {cats[panelTab].items.map(key=>{
          const def = defOf(key);
          const cost = def.baseCost || def.cost || 0;
          const locked = def.unlockLevel && state.level < def.unlockLevel;
          const cant = state.msdk < cost;
          const own = state.buildings.filter(b => b.type === key).length;
          return (
            <div key={key} className={`build-card ${locked?'locked':''}`}
              onClick={()=>{ if (locked || cant) return; if (confirm(`بناء ${def.name} بسعر ${fmt(cost)} MSDK؟`)) startBuild(key); }}>
              {own > 0 && <div className="own">×{own}</div>}
              <div className="e">{def.emoji}</div>
              <div className="n">{def.name}</div>
              <div className="c">🪙 {fmt(cost)}</div>
              {def.desc && <div className="c" style={{fontSize:9,color:'#5d4037',marginTop:2}}>{def.desc.slice(0,40)}</div>}
              {locked && <div className="c" style={{color:'#b71c1c'}}>🔒 م{def.unlockLevel}</div>}
              {!locked && cant && <div className="c" style={{color:'#b71c1c'}}>💸</div>}
              <button onClick={(e)=>{e.stopPropagation(); showInfo(key);}}
                style={{marginTop:4,padding:'2px 6px',fontSize:10,borderRadius:6,border:'1px solid #5d4037',background:'#fff',cursor:'pointer'}}>تفاصيل</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MarketPanel({listings: serverListings = [], buyFromMarket, onClose, fmt, fmtTime}){
  const [filter, setFilter] = useState('all');
  const [sortBy, setSortBy] = useState('priceAsc');
  const items = ['all', 'wheat','cucumber','carrot','corn','tomato','pepper','strawberry',
                 'watermelon','pumpkin','grape','egg','milk','wool','meat','fur',
                 'flour','bread','cheese','butter','cake','fabric','juice','jam','wine'];
  const listings = serverListings.filter(l => filter==='all' || l.item===filter);
  const marketStats = {};
  serverListings.forEach(l => {
    if (!marketStats[l.item]) marketStats[l.item] = { prices: [], qty: 0 };
    marketStats[l.item].prices.push(l.price);
    marketStats[l.item].qty += l.qty;
  });
  // الفرز
  const sorted = [...listings].sort((a,b)=>{
    if (sortBy === 'priceAsc')  return a.price - b.price;
    if (sortBy === 'priceDesc') return b.price - a.price;
    if (sortBy === 'qtyAsc')    return a.qty - b.qty;
    if (sortBy === 'qtyDesc')   return b.qty - a.qty;
    return 0;
  });
  return (
    <div className="panel">
      <button className="close-x" onClick={onClose}>✖</button>
      <h3>🏛 السوق العالمي - عرض وطلب</h3>
      <div style={{fontSize:11,color:'#fff',marginBottom:6}}>
        💡 محاكاة سوق العرض/الطلب من لاعبين افتراضيين. للنشر الحقيقي مع لاعبين فعليين يلزم backend.
      </div>

      {/* فرز */}
      <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:6,padding:6,background:'rgba(0,0,0,0.2)',borderRadius:8}}>
        <span style={{fontSize:11,color:'#fff',fontWeight:900,alignSelf:'center'}}>📊 فرز:</span>
        {[
          {k:'priceAsc',  l:'💰 الأرخص'},
          {k:'priceDesc', l:'💰 الأغلى'},
          {k:'qtyDesc',   l:'📦 الأكثر كمية'},
          {k:'qtyAsc',    l:'📦 الأقل كمية'},
        ].map(o => (
          <button key={o.k} onClick={()=>setSortBy(o.k)}
            className={`panel-tab ${sortBy===o.k?'active':''}`}
            style={{fontSize:11,padding:'3px 8px'}}>{o.l}</button>
        ))}
      </div>

      {/* فلتر السلعة */}
      <div className="panel-tabs" style={{marginBottom:8,maxHeight:80,overflowY:'auto'}}>
        {items.map(k => (
          <button key={k} className={`panel-tab ${filter===k?'active':''}`}
            onClick={()=>setFilter(k)} style={{fontSize:11,padding:'3px 8px'}}>
            {k==='all'?'كل':(PRODUCT_EMOJI[k]||'📦')+' '+(PRODUCTS[k]||k)}
          </button>
        ))}
      </div>

      {/* إحصائيات سريعة للسلعة المختارة */}
      {filter !== 'all' && marketStats[filter] && (
        <div style={{fontSize:11,padding:6,background:'#fff8e1',color:'#4e342e',borderRadius:8,marginBottom:6}}>
          📈 السلعة: <b>{PRODUCTS[filter]}</b> •
          الإجمالي: {marketStats[filter].qty} •
          أرخص: {fmt(Math.min(...marketStats[filter].prices))} •
          أغلى: {fmt(Math.max(...marketStats[filter].prices))} •
          متوسط: {fmt(Math.round(marketStats[filter].prices.reduce((a,b)=>a+b,0)/marketStats[filter].prices.length))}
        </div>
      )}

      {sorted.length === 0 && <div style={{padding:20,textAlign:'center',color:'#fff'}}>
        ⏳ لا توجد عروض الآن - تحقّق بعد قليل
      </div>}
      <div style={{maxHeight:'45vh',overflowY:'auto'}}>
      {sorted.map(l=>{
        // حدد إذا كان السعر أعلى/أدنى من المتوسط
        const stats = marketStats[l.item];
        let priceTag = '';
        if (stats && stats.prices.length > 1) {
          const avg = stats.prices.reduce((a,b)=>a+b,0)/stats.prices.length;
          if (l.price < avg * 0.85) priceTag = '🟢 رخيص';
          else if (l.price > avg * 1.15) priceTag = '🔴 غالي';
        }
        return (
          <div key={l.id} className="order-row">
            <span style={{fontSize:24}}>{PRODUCT_EMOJI[l.item]||'📦'}</span>
            <div>
              <div style={{fontWeight:900}}>{l.qty}× {PRODUCTS[l.item]||l.item}</div>
              <div style={{fontSize:10,color:'#666'}}>من: {l.seller_name || l.seller} {priceTag}</div>
            </div>
            <div style={{fontWeight:900,color:'#bf360c'}}>{fmt(l.price)} MSDK<br/>
              <span style={{fontSize:10,color:'#666'}}>الكل: {fmt(l.price*l.qty)}</span></div>
            <button className="menu-btn mb-up" onClick={()=>buyFromMarket(l)}
              style={{padding:'4px 8px',fontSize:11}}>شراء</button>
          </div>
        );
      })}
      </div>
    </div>
  );
}
