function CryptoDepositForm({user, fmt, showToast, refreshState}){
  const [info, setInfo] = useState(null);
  const [history, setHistory] = useState([]);
  const [selected, setSelected] = useState('tron-usdt');
  const [txHash, setTxHash] = useState('');
  const [busy, setBusy] = useState(false);
  const [copyOk, setCopyOk] = useState(false);

  useEffect(()=>{
    API.req('GET','/wallet/deposit-info').then(setInfo).catch(()=>{});
    API.req('GET','/wallet/crypto-history').then(r => setHistory(r.deposits||[])).catch(()=>{});
  }, []);

  const verify = async ()=>{
    if (!txHash.trim()) { showToast('❌ أدخل tx hash'); return; }
    setBusy(true);
    try {
      const r = await API.req('POST','/wallet/crypto-deposit', { network: selected, txHash: txHash.trim() });
      showToast(`✅ ${r.amount} ${r.currency} → ${fmt(r.msdkAmount)} MSDK`);
      setTxHash('');
      refreshState();
      const h = await API.req('GET','/wallet/crypto-history');
      setHistory(h.deposits||[]);
    } catch(e) {
      showToast('❌ '+e.message);
    }
    setBusy(false);
  };

  const copy = (text)=>{
    navigator.clipboard?.writeText(text);
    setCopyOk(true); setTimeout(()=>setCopyOk(false), 1500);
  };

  if (!info) return <div style={{color:'#fff',padding:10}}>...جاري التحميل</div>;
  const net = info.networks.find(n => n.id === selected) || info.networks[0];

  return (
    <div>
      <h4 style={{color:'#90caf9',marginTop:0}}>🪙 شحن MSDK بالعملات الرقمية</h4>

      <div style={{padding:8,background:'rgba(76,175,80,0.2)',borderRadius:8,fontSize:11,marginBottom:8,color:'#fff'}}>
        💱 <b>الأسعار:</b> 1 USDT = {fmt(info.rates.USDT)} MSDK • 1 TRX = {fmt(info.rates.TRX)} MSDK • 1 BNB = {fmt(info.rates.BNB)} MSDK
      </div>

      <label style={{fontSize:12,color:'#fff'}}>اختر الشبكة:</label>
      <select value={selected} onChange={(e)=>setSelected(e.target.value)}
        style={{width:'100%',padding:8,marginBottom:8,borderRadius:8,border:'2px solid #d7ccc8',background:'#fff',color:'#3e2723',fontWeight:900}}>
        {info.networks.map(n => (
          <option key={n.id} value={n.id}>{n.label} - رسوم: {n.fee}</option>
        ))}
      </select>

      {net.addr ? (
        <div style={{background:'#fff',padding:10,borderRadius:8,color:'#3e2723',marginBottom:8}}>
          <div style={{fontSize:11,marginBottom:4,fontWeight:900}}>📋 عنوان الإيداع ({net.currency}):</div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <code style={{fontSize:11,wordBreak:'break-all',flex:1,background:'#f5f5f5',padding:4,borderRadius:4}}>{net.addr}</code>
            <button onClick={()=>copy(net.addr)}
              style={{padding:'4px 10px',borderRadius:6,border:'1px solid #5d4037',background:copyOk?'#4caf50':'#fff',color:copyOk?'#fff':'#3e2723',cursor:'pointer',fontWeight:900,fontSize:11}}>
              {copyOk?'✓':'📋'}
            </button>
          </div>
          <img alt="QR" style={{display:'block',margin:'8px auto',width:160,height:160,background:'#fff',padding:4,border:'1px solid #d7ccc8'}}
            src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(net.addr)}`} />
        </div>
      ) : (
        <div style={{padding:10,background:'#fff3e0',borderRadius:8,color:'#bf360c',fontSize:12,marginBottom:8}}>
          ⚠️ عنوان {net.currency} غير مكوّن. اطلب من الأدمن إضافة <code>DEPOSIT_TRX_ADDRESS</code> أو <code>DEPOSIT_BSC_ADDRESS</code> في إعدادات Railway.
        </div>
      )}

      <div style={{fontSize:11,marginBottom:6,color:'#ffeb3b',padding:6,background:'rgba(0,0,0,0.3)',borderRadius:6}}>
        <b>📝 الخطوات:</b><br/>
        1️⃣ أرسل {net.currency} من محفظتك (TronLink/Trust Wallet/Binance) إلى العنوان أعلاه<br/>
        2️⃣ انتظر تأكيد المعاملة على البلوكشين (~30 ثانية)<br/>
        3️⃣ انسخ <b>Transaction Hash</b> من محفظتك<br/>
        4️⃣ الصقه هنا واضغط تحقق - سيُضاف MSDK تلقائياً
      </div>

      <label style={{fontSize:12,color:'#fff'}}>Transaction Hash (TxID):</label>
      <input className="input" value={txHash} onChange={(e)=>setTxHash(e.target.value)}
        placeholder="مثال: 0xabc123... أو abc123..." disabled={!net.addr}
        style={{marginBottom:6}} />
      <button onClick={verify} disabled={busy || !net.addr}
        className="menu-btn mb-up" style={{width:'100%',padding:10,fontSize:13}}>
        {busy ? '⏳ جاري التحقق من البلوكشين...' : `✅ تحقق وأضف MSDK`}
      </button>

      <h4 style={{color:'#ce93d8',marginTop:14}}>📜 تاريخ إيداعاتك الكريبتو</h4>
      <div style={{maxHeight:'25vh',overflowY:'auto'}}>
      {history.length === 0 && <div style={{color:'#fff',padding:8,fontSize:11}}>لا توجد إيداعات بعد</div>}
      {history.map(h => (
        <div key={h.id} style={{background:'#fff',color:'#3e2723',padding:6,borderRadius:6,marginBottom:3,fontSize:11}}>
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <strong>{h.amount_crypto} {h.currency}</strong>
            <span style={{color:'#1b5e20',fontWeight:900}}>+{fmt(h.amount_msdk)} MSDK</span>
          </div>
          <div style={{fontSize:9,color:'#666',wordBreak:'break-all'}}>tx: {h.tx_hash}</div>
          <div style={{fontSize:9,color:'#999'}}>{new Date(h.created_at).toLocaleString('ar-SA')}</div>
        </div>
      ))}
      </div>
    </div>
  );
}

function ChatPanel({chatMessages = [], user, chatInput, setChatInput, sendChat, onClose}){
  return (
    <div className="panel">
      <button className="close-x" onClick={onClose}>✖</button>
      <h3>💬 الدردشة العالمية - مباشرة بين اللاعبين</h3>
      <div style={{fontSize:10,color:'#aed581',marginBottom:6}}>
        ✅ متصل بالخادم - رسائل حقيقية من لاعبين متصلين الآن
      </div>
      <div style={{maxHeight:'45vh',overflowY:'auto',display:'flex',flexDirection:'column'}}>
      {chatMessages.length === 0 && <div style={{color:'#fff',padding:10,textAlign:'center'}}>لا رسائل بعد - كن أول من يبدأ! 👋</div>}
      {chatMessages.map(m=>(
        <div key={m.id} className={`chat-msg ${m.me?'me':''}`}>
          <span className="u">{m.user_name || m.user}:</span> {m.text}
        </div>
      ))}
      </div>
      <div style={{display:'flex',gap:6,marginTop:8}}>
        <input className="input" value={chatInput} onChange={(e)=>setChatInput(e.target.value)}
          placeholder="اكتب رسالة..." onKeyDown={(e)=>{if (e.key==='Enter') sendChat();}}/>
        <button className="menu-btn mb-up" onClick={sendChat}>إرسال</button>
      </div>
    </div>
  );
}

function AdminPanel({state, setState, onClose, fmt}){
  const [stats, setStats] = useState(null);
  const [players, setPlayers] = useState([]);
  const [log, setLog] = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [tab, setTab] = useState('stats');

  const refresh = useCallback(()=>{
    API.adminStats().then(r => setStats(r)).catch(()=>{});
    API.adminPlayers().then(r => setPlayers(r.players||[])).catch(()=>{});
    API.adminLog().then(r => setLog(r.log||[])).catch(()=>{});
    API.adminTransactions().then(r => setTransactions(r.transactions||[])).catch(()=>{});
  }, []);
  useEffect(()=>{ refresh(); const t = setInterval(refresh, 10_000); return ()=>clearInterval(t); }, []);

  const adjust = async (uid, name) => {
    const amt = prompt(`تعديل رصيد ${name} (موجب=إيداع، سالب=خصم):`);
    if (!amt) return;
    const reason = prompt('السبب:') || 'تعديل أدمن';
    try {
      await API.adminAdjust(uid, parseInt(amt,10), reason);
      refresh();
    } catch(e) { alert('خطأ: '+e.message); }
  };

  return (
    <div className="panel" style={{background:'linear-gradient(180deg,#4a148c,#1a0033)'}}>
      <button className="close-x" onClick={onClose}>✖</button>
      <h3>👑 لوحة الأدمن - بيانات حقيقية من الخادم</h3>

      <div className="panel-tabs" style={{marginBottom:8}}>
        {[
          {k:'stats', l:'📊 إحصائيات'},
          {k:'players', l:'👥 اللاعبون'},
          {k:'tx', l:'💸 المعاملات'},
          {k:'log', l:'📜 السجل'},
        ].map(t => (
          <button key={t.k} className={`panel-tab ${tab===t.k?'active':''}`}
            onClick={()=>setTab(t.k)}>{t.l}</button>
        ))}
      </div>

      {tab==='stats' && stats && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div className="build-card"><div className="e">👥</div>
            <div className="n">إجمالي اللاعبين</div>
            <div className="c" style={{fontSize:20,fontWeight:900}}>{stats.totalPlayers}</div></div>
          <div className="build-card"><div className="e">🟢</div>
            <div className="n">متصلون الآن (5د)</div>
            <div className="c" style={{fontSize:20,fontWeight:900,color:'#2e7d32'}}>{stats.onlinePlayers}</div></div>
          <div className="build-card"><div className="e">🪙</div>
            <div className="n">إجمالي MSDK</div>
            <div className="c" style={{fontSize:14,fontWeight:900}}>{fmt(stats.totalMSDK)}</div></div>
          <div className="build-card"><div className="e">📦</div>
            <div className="n">عروض السوق</div>
            <div className="c" style={{fontSize:18,fontWeight:900}}>{stats.activeListings}</div></div>
          <div className="build-card"><div className="e">📥</div>
            <div className="n">إيداعات (24س)</div>
            <div className="c" style={{fontSize:14,fontWeight:900,color:'#1b5e20'}}>+{fmt(stats.recentDeposits)}</div></div>
          <div className="build-card"><div className="e">📤</div>
            <div className="n">سحوبات (24س)</div>
            <div className="c" style={{fontSize:14,fontWeight:900,color:'#b71c1c'}}>-{fmt(stats.recentWithdrawals)}</div></div>
        </div>
      )}

      {tab==='players' && (
        <div style={{maxHeight:'50vh',overflowY:'auto'}}>
        {players.map(p => {
          const online = (Date.now() - p.last_seen) < 5*60*1000;
          return (
            <div key={p.id} className="order-row" style={{gridTemplateColumns:'auto 1fr auto auto'}}>
              <div style={{fontSize:24}}>{p.type==='admin'?'👑':'👤'}</div>
              <div>
                <div style={{fontWeight:900}}>{p.name} {online && '🟢'}</div>
                <div style={{fontSize:10}}>م.{p.level} • XP {p.xp} • منذ {new Date(p.created_at).toLocaleDateString('ar-SA')}</div>
              </div>
              <div style={{fontWeight:900,color:'#bf360c'}}>{fmt(p.msdk)} 🪙</div>
              <button onClick={()=>adjust(p.id, p.name)} className="menu-btn mb-cl" style={{padding:'3px 6px',fontSize:10}}>تعديل</button>
            </div>
          );
        })}
        </div>
      )}

      {tab==='tx' && (
        <div style={{maxHeight:'50vh',overflowY:'auto'}}>
        {transactions.map(t => (
          <div key={t.id} style={{background:'rgba(255,255,255,0.1)',color:'#fff',padding:6,borderRadius:6,marginBottom:3,fontSize:11}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <strong>{t.user_name||'?'}</strong>
              <span style={{color: t.amount>=0?'#a5d6a7':'#ef9a9a',fontWeight:900}}>{t.amount>=0?'+':''}{fmt(t.amount)}</span>
            </div>
            <div style={{fontSize:10,opacity:0.8}}>{t.type} {t.item?'· '+t.qty+'× '+t.item:''} {t.note?'· '+t.note:''}</div>
            <div style={{fontSize:9,opacity:0.6}}>{new Date(t.time).toLocaleString('ar-SA')}</div>
          </div>
        ))}
        </div>
      )}

      {tab==='log' && (
        <div style={{maxHeight:'50vh',overflowY:'auto'}}>
        {log.map(l => (
          <div key={l.id} style={{background:'rgba(255,255,255,0.1)',color:'#fff',padding:6,borderRadius:6,marginBottom:3,fontSize:11}}>
            <strong>{l.user_name||'?'}</strong>: {l.action} {l.details?'· '+l.details:''}
            <div style={{fontSize:9,opacity:0.7}}>{new Date(l.time).toLocaleString('ar-SA')}</div>
          </div>
        ))}
        </div>
      )}

      <div style={{marginTop:10,padding:6,background:'rgba(0,0,0,0.3)',borderRadius:6,fontSize:11,color:'#fff'}}>
        ⚡ سرعة الوقت (محلي):
        <input type="number" step="0.01" min="0.01" max="100" value={state.timeMul}
          onChange={(e)=>setState(s=>({...s, timeMul: parseFloat(e.target.value)||1}))}
          style={{width:60,padding:2,fontSize:11,marginRight:6}}/>
        (0.01 = أسرع 100×)
      </div>
    </div>
  );
}

function FactoryModal({building, state, startRecipe, collectRecipe, onClose, fmt, fmtTime, tMul}){
  if (!building) return null;
  const f = FACTORIES[building.type]; if (!f) return null;
  return (
    <div className="modal" onClick={onClose}>
      <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
        <button className="close-x" onClick={onClose}>✖</button>
        <h3 style={{color:'#bf360c',margin:'0 0 8px'}}>{f.emoji} {f.name}</h3>
        <div style={{fontSize:12,marginBottom:10}}>{f.desc}</div>

        <h4>🍽 طابور الإنتاج ({(building.queue||[]).length}/{building.queueCap||3})</h4>
        {(building.queue||[]).length === 0 && <div style={{padding:8,background:'#fff',borderRadius:8,fontSize:12,color:'#666',marginBottom:8}}>
          الطابور فارغ - ابدأ وصفة من الأسفل
        </div>}
        {(building.queue||[]).map((q,i)=>{
          const r = f.recipes.find(rc => rc.id === q.recipeId);
          if (!r) return null;
          const elapsed = (Date.now() - q.startedAt)/1000;
          const total = r.time * tMul;
          const ready = elapsed >= total;
          return (
            <div key={i} className="order-row" style={{gridTemplateColumns:'auto 1fr auto'}}>
              <div style={{fontSize:24}}>{PRODUCT_EMOJI[Object.keys(r.out)[0]]}</div>
              <div>
                <div style={{fontWeight:900}}>{Object.entries(r.out).map(([k,n])=>`${n}× ${PRODUCTS[k]||k}`).join(', ')}</div>
                <div style={{fontSize:11,color:'#666'}}>{ready ? '✅ جاهز' : '⏳ '+fmtTime(total - elapsed)}</div>
              </div>
              <button disabled={!ready} className={ready?'menu-btn mb-up':'menu-btn'}
                onClick={()=>collectRecipe(building.id, i)} style={{padding:'4px 8px'}}>جمع</button>
            </div>
          );
        })}

        <h4 style={{marginTop:10}}>📑 الوصفات المتاحة</h4>
        {f.recipes.map(r=>{
          const have = {...state.crops, ...state.products};
          const ok = Object.entries(r.in).every(([k,n]) => (have[k]||0) >= n);
          return (
            <div key={r.id} className="seed-row">
              <div style={{fontSize:30}}>{PRODUCT_EMOJI[Object.keys(r.out)[0]]}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:900}}>{Object.entries(r.out).map(([k,n])=>`${n}× ${PRODUCTS[k]||k}`).join(', ')}</div>
                <div style={{fontSize:11}}>
                  المدخلات: {Object.entries(r.in).map(([k,n])=>{
                    const has = have[k]||0;
                    return <span key={k} className={has>=n?'pill pill-have':'pill pill-cost'}>{n}× {PRODUCTS[k]||k} ({has})</span>;
                  })}
                </div>
                <div style={{fontSize:10,color:'#666'}}>⏱ {fmtTime(r.time)} • +{r.xp} XP • قيمة: {fmt(r.value)}</div>
              </div>
              <button disabled={!ok} onClick={()=>startRecipe(building.id, r.id)}
                className={ok?'menu-btn mb-up':'menu-btn'}>بدء</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PenModal({building, state, buyAnimal, sellAnimal, collectFromAnimal, onClose, fmt, fmtTime, tMul}){
  if (!building) return null;
  const def = PEN_TYPES[building.type]; if (!def) return null;
  const a = ANIMALS[def.animal];
  const cap = def.baseCap + (building.level-1) * def.capPerLevel;
  return (
    <div className="modal" onClick={onClose}>
      <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
        <button className="close-x" onClick={onClose}>✖</button>
        <h3 style={{color:'#bf360c',margin:'0 0 8px'}}>{def.emoji} {def.name} (م{building.level})</h3>
        <div style={{fontSize:12,marginBottom:10}}>{def.desc}</div>
        <div style={{fontSize:13,marginBottom:10}}>السعة: {(building.animals||[]).length}/{cap}</div>

        <button disabled={(building.animals||[]).length >= cap || state.msdk < a.cost}
          className="menu-btn mb-up" style={{width:'100%',padding:10}}
          onClick={()=>buyAnimal(building.id)}>
          🛒 شراء {a.name} - {fmt(a.cost)} MSDK
        </button>

        <h4 style={{marginTop:10}}>🐾 الحيوانات</h4>
        {(building.animals||[]).length === 0 && <div style={{padding:8,background:'#fff',borderRadius:8,fontSize:12,color:'#666'}}>
          لا حيوانات - اشتر واحداً من الأعلى
        </div>}
        {(building.animals||[]).map(an=>{
          const elapsed = (Date.now() - an.lastCollect)/1000;
          const total = a.cycle * tMul;
          const ready = elapsed >= total;
          return (
            <div key={an.id} className="order-row" style={{gridTemplateColumns:'auto 1fr auto auto'}}>
              <div style={{fontSize:30}}>{a.emoji}</div>
              <div>
                <div style={{fontWeight:900}}>{a.name}</div>
                <div style={{fontSize:11,color:'#666'}}>
                  ينتج {a.produce} {a.pEmoji} كل {fmtTime(a.cycle)}
                </div>
                <div style={{fontSize:11,color:ready?'#1b5e20':'#0d47a1'}}>
                  {ready ? '✅ جاهز للجمع' : '⏳ '+fmtTime(total - elapsed)}
                </div>
              </div>
              <button disabled={!ready} onClick={(e)=>collectFromAnimal(building.id, an.id, e)}
                className={ready?'menu-btn mb-up':'menu-btn'} style={{padding:'4px 6px',fontSize:11}}>جمع</button>
              <button onClick={()=>{ if (confirm(`بيع ${a.name}؟`)) sellAnimal(building.id, an.id); }}
                className="menu-btn mb-rm" style={{padding:'4px 6px',fontSize:11}}>بيع</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ListItemModal({idx, state, onList, onClose, fmt}){
  const all = {...state.crops, ...state.products};
  const items = Object.entries(all).filter(([_,n])=>n>0);
  const [selected, setSelected] = useState(items[0]?.[0] || null);
  const [qty, setQty] = useState(1);
  const [price, setPrice] = useState(0);
  useEffect(()=>{ if (selected) setPrice(baseValueOf(selected)); }, [selected]);
  const maxQty = selected ? all[selected]||0 : 0;
  return (
    <div className="modal" onClick={onClose}>
      <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
        <button className="close-x" onClick={onClose}>✖</button>
        <h3 style={{color:'#bf360c',margin:'0 0 10px'}}>📌 عرض في صندوق #{idx+1}</h3>
        {items.length === 0 && <div style={{padding:14,background:'#fff3e0',borderRadius:10,textAlign:'center'}}>
          📭 لا يوجد لديك ما تبيعه - احصد أو اصنع أولاً
        </div>}
        {items.length > 0 && <>
          <h4>1. اختر السلعة</h4>
          <div className="panel-grid">
            {items.map(([k,n])=>(
              <div key={k} className={`build-card ${selected===k?'':''}`}
                onClick={()=>setSelected(k)}
                style={{borderColor: selected===k?'#ff8f00':'#5d4037', borderWidth:3}}>
                <div className="own">×{n}</div>
                <div className="e">{PRODUCT_EMOJI[k]||'📦'}</div>
                <div className="n">{PRODUCTS[k]||k}</div>
                <div className="c">قيمة: {fmt(baseValueOf(k))}</div>
              </div>
            ))}
          </div>
          {selected && <>
            <h4>2. الكمية والسعر</h4>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
              <label style={{fontSize:12}}>الكمية (max {maxQty}):
                <input className="input" type="number" min="1" max={maxQty} value={qty}
                  onChange={(e)=>setQty(Math.max(1, Math.min(maxQty, parseInt(e.target.value)||1)))}/>
              </label>
              <label style={{fontSize:12}}>سعر/قطعة (MSDK):
                <input className="input" type="number" min="1" value={price}
                  onChange={(e)=>setPrice(Math.max(1, parseInt(e.target.value)||1))}/>
              </label>
            </div>
            <div style={{padding:8,background:'#fff8e1',borderRadius:8,marginTop:8,fontSize:12}}>
              💡 السعر السوقي: {fmt(baseValueOf(selected))} MSDK<br/>
              📊 إجمالي الصفقة: {fmt(qty * price)} MSDK<br/>
              ⚠️ السعر الأعلى = احتمال بيع أقل
            </div>
            <button className="menu-btn mb-up" style={{width:'100%',marginTop:10,padding:10}}
              onClick={()=>onList(selected, qty, price)}>📌 عرض للبيع</button>
          </>}
        </>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
